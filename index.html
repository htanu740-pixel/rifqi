<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap Absensi Kelas X TKJ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="nav">
      <img src="logo-smk.png" alt="Logo SMK" class="logo" />
      <h1>SMK AN-NUR</h1>
      <p>Kelas X TKJ — Rekapan Absensi Modern</p>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Input Absensi -->
      <div class="card">
        <h2>📅 Input Absensi Harian</h2>
        <div class="form">
          <label for="tanggal">Tanggal</label>
          <input type="date" id="tanggal" />

          <label for="nama">Nama Siswa</label>
          <select id="nama"></select>

          <label for="status">Keterangan</label>
          <select id="status">
            <option value="Hadir">✅ Hadir</option>
            <option value="Izin">🟡 Izin</option>
            <option value="Sakit">🟠 Sakit</option>
            <option value="Alpa">🔴 Alpa</option>
          </select>

          <button id="tambahBtn">+ Simpan Absensi</button>
        </div>
      </div>

      <!-- Daftar Absensi -->
      <div class="card">
        <h2>📋 Daftar Absensi</h2>
        <table id="tabelAbsensi">
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Nama</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelBody"></tbody>
        </table>
      </div>

      <!-- Rekapan Bulanan -->
      <div class="card">
        <h2>📆 Rekap Bulanan</h2>
        <div class="rekap-input">
          <input type="month" id="bulan" />
          <button id="tampilRekap">Tampilkan Rekap</button>
        </div>
        <div id="rekapContainer"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 SMK AN-NUR | Kelas X TKJ (25 siswa)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
